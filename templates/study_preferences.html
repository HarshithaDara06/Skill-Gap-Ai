<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Preferences | SkillGap AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #243b6b;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .days label {
            background: #f1f4fa;
            padding: 12px;
            border-radius: 8px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #3156a3;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #243b6b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📅 Your Weekly Learning Planner</h1>

    <p>Customize your study schedule based on your availability.</p>

    <form action="{{ url_for('generate_learning_schedule') }}" method="POST">

        <h3>Select Your Available Days</h3>

        <div class="days">
            {% for day in ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] %}
                <label>
                    <input type="checkbox" name="days" value="{{ day }}">
                    {{ day }}
                </label>
            {% endfor %}
        </div>

        <h3>Daily Study Hours</h3>

        <input
            type="number"
            name="study_hours"
            min="0.5"
            max="8"
            step="0.5"
            value="1"
            required
        >

        <button type="submit">Generate My Weekly Plan</button>

    </form>

</div>

</body>
</html>
