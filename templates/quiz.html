<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ skill }} Quiz | SkillGap AI</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            padding: 25px;
            color: #24304a;
        }

        .container {
            max-width: 750px;
            margin: 30px auto;
        }

        .question-card {
            background: white;
            padding: 22px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .option {
            display: block;
            padding: 12px;
            margin: 10px 0;
            background: #f4f6fb;
            border-radius: 7px;
            cursor: pointer;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🧠 {{ skill }} Quiz</h1>

    <p>Answer all questions and submit your quiz.</p>

    <form action="{{ url_for('submit_quiz') }}" method="POST">

        <input type="hidden" name="skill" value="{{ skill }}">

        {% for question in questions %}
        {% set question_index = loop.index0 %}

            <div class="question-card">

                <h3>Question {{ loop.index }}</h3>

                <p>{{ question["question"] }}</p>

                {% for option in question["options"] %}

                    <label class="option">
                        <input
                            type="radio"
                            name="answer_{{ question_index }}"
                            value="{{ option }}"
                            required
                        >
                        {{ option }}
                    </label>

                {% endfor %}

            </div>

        {% endfor %}

        <button type="submit">Submit Quiz</button>

    </form>

</div>

</body>
</html>
